name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: golang:1.26-alpine

    env:
      SDL2_VERSION: release-2.32.2

    steps:
      - name: Install build dependencies
        run: |
          apk add --no-cache \
            gcc g++ musl-dev make cmake git pkgconf \
            alsa-lib-dev mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            wayland-dev linux-headers

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache static SDL2 build
        id: sdl2-cache
        uses: actions/cache@v4
        with:
          path: /usr/local/sdl2-static
          key: sdl2-static-${{ env.SDL2_VERSION }}-alpine-${{ hashFiles('/etc/os-release') }}

      - name: Build static SDL2
        if: steps.sdl2-cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch "$SDL2_VERSION" --depth 1 https://github.com/libsdl-org/SDL.git /tmp/sdl2
          cmake -S /tmp/sdl2 -B /tmp/sdl2/build \
            -DSDL_STATIC=ON -DSDL_SHARED=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/sdl2/build --parallel
          cmake --install /tmp/sdl2/build --prefix /usr/local/sdl2-static

      - name: Make static SDL2 visible to pkg-config
        run: |
          echo "PKG_CONFIG_PATH=/usr/local/sdl2-static/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "CGO_CFLAGS=-I/usr/local/sdl2-static/include/SDL2" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L/usr/local/sdl2-static/lib" >> "$GITHUB_ENV"

      - name: Build static binary
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: amd64
          VERSION: ${{ github.ref_name }} # tag name as only runs on tags
        run: |
          go build \
            -buildvcs=false \
            -ldflags="-s -w -linkmode external -extldflags -static -X main.version=$VERSION" \
            -o scrawl \
            .

      - name: Verify binary is statically linked
        run: |
          file scrawl
          ldd scrawl || true

      - name: Bundle with LICENSE
        run: |
          mkdir scrawl-linux-x86_64
          mv scrawl scrawl-linux-x86_64
          cp LICENSE scrawl-linux-x86_64
          tar -czf scrawl-linux-x86_64.tar.gz scrawl-linux-x86_64

      - name: Attach binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: scrawl-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
